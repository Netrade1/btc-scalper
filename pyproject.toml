[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "btc-scalper"
version = "1.0.0"
description = "Walk-forward ML trading system for BTC with a fail-closed risk governor (paper trading only)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "ccxt>=4.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
btc-scalper = "btc_scalper.cli:main"

[tool.setuptools.packages.find]
include = ["btc_scalper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
